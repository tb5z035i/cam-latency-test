[package]
name = "cam_latency_test"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
arboard = "=3.3.0"
base64 = "0.22"
crossbeam-channel = "0.5"
# Older egui stack kept for Rust 1.83 compatibility.
eframe = { version = "=0.22.0", default-features = false, features = ["default_fonts", "glow"] }
ccap-rs = { version = "=1.5.1", default-features = true }
home = "=0.5.5"
image = { version = "=0.24.9", default-features = false, features = ["jpeg", "png"] }
imageproc = "=0.23.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "1.3"
thiserror = "2.0"
